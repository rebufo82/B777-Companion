<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B777">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1016">
<meta name="color-scheme" content="dark light">
<title>B777 Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --panel2:#efe9dd; --line:#d9d1c0;
  --ink:#1c1a15; --ink2:#5d564a; --ink3:#8a8273;
  --accent:#9a6b12; --accent-ink:#5e3f00; --accent-bg:#f6e8c8;
  --qrh:#b23a28; --mel:#8a6a12; --fcom:#2b6079; --notes:#4b5a3a;
  --fctm:#2f7d6b; --oma:#6a4b8a; --omc:#4a6a86; --raig:#a85a2a;
  --mark:#ffe49a; --mark-ink:#3a2c00;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 8px 24px rgba(40,30,10,.08);
  --radius:14px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="day"]){
  --bg:#0b1016; --panel:#141b23; --panel2:#1c2630; --line:#2a3642;
  --ink:#e8edf2; --ink2:#a9b6c2; --ink3:#73828f;
  --accent:#e2b457; --accent-ink:#f2d79a; --accent-bg:#2a2214;
  --qrh:#e8705c; --mel:#d6b25e; --fcom:#6fb4d6; --notes:#9ab87a;
  --fctm:#5fc3ad; --oma:#b79bd6; --omc:#8fa6bd; --raig:#e0905a;
  --mark:#5a4a16; --mark-ink:#ffe49a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="night"]{
  --bg:#0b1016; --panel:#141b23; --panel2:#1c2630; --line:#2a3642;
  --ink:#e8edf2; --ink2:#a9b6c2; --ink3:#73828f;
  --accent:#e2b457; --accent-ink:#f2d79a; --accent-bg:#2a2214;
  --qrh:#e8705c; --mel:#d6b25e; --fcom:#6fb4d6; --notes:#9ab87a;
  --fctm:#5fc3ad; --oma:#b79bd6; --omc:#8fa6bd; --raig:#e0905a;
  --mark:#5a4a16; --mark-ink:#ffe49a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding-bottom:calc(24px + var(--safe-b));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-t);background:var(--panel);z-index:40}
.wrap{max-width:860px;margin:0 auto;
  padding-left:max(16px,var(--safe-l)); padding-right:max(16px,var(--safe-r));}
/* header */
header{position:sticky;top:var(--safe-t);z-index:30;background:var(--panel);
  border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:1.05rem;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand small{color:var(--ink3);font-size:.72rem;letter-spacing:.3px;text-transform:uppercase}
.hbtn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);
  font:inherit;font-size:.8rem;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.hbtn:active{transform:translateY(1px)}
.searchrow{padding-bottom:12px;position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:50;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sgi{display:flex;align-items:baseline;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.sgi:last-child{border-bottom:0}
.sgi:hover,.sgi.on{background:var(--panel)}
.sgt{color:var(--ink);font-size:.98rem;font-weight:600;line-height:1.35}
.sgt mark{background:transparent;color:var(--accent);padding:0}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.searchbox svg{flex:none;color:var(--ink3)}
#q{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;outline:none;min-width:0}
#q::placeholder{color:var(--ink3)}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.clr{border:0;background:transparent;color:var(--ink3);font-size:1.3rem;line-height:1;cursor:pointer;padding:0 2px}
.facets{display:flex;gap:7px;padding-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.facet{flex:none;appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink2);
  font:inherit;font-size:.82rem;border-radius:999px;padding:6px 13px;cursor:pointer}
.facet[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
/* content */
main{padding-top:16px}
.hint{color:var(--ink3);font-size:.9rem;text-align:center;padding:10px 0 18px}
.sec-h{display:flex;align-items:baseline;gap:9px;margin:18px 0 9px}
.sec-h .dot{width:9px;height:9px;border-radius:50%;flex:none}
.sec-h b{font-size:.78rem;text-transform:uppercase;letter-spacing:.7px}
.sec-h span{color:var(--ink3);font-size:.76rem}
.dot.QRH{background:var(--qrh)} .dot.MEL{background:var(--mel)}
.dot.FCOM{background:var(--fcom)} .dot.NOTES{background:var(--notes)}
.dot.FCTM{background:var(--fctm)} .dot.OMA{background:var(--oma)}
.dot.OMC{background:var(--omc)} .dot.RAIG{background:var(--raig)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 15px;margin-bottom:10px;cursor:pointer;position:relative}
.card:active{transform:translateY(1px)}
.card .crumb{font-size:.73rem;color:var(--ink3);margin-bottom:3px;line-height:1.35}
.card .ttl{font-weight:650;font-size:1rem;margin-bottom:5px;line-height:1.3}
.card .snip{font-size:.9rem;color:var(--ink2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ref{font-family:var(--mono);font-size:.72rem;color:var(--ink3);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px}
.ref b{color:var(--accent);font-weight:600}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.pin{position:absolute;top:10px;right:10px;border:0;background:transparent;cursor:pointer;
  color:var(--ink3);font-size:1.05rem;line-height:1;padding:4px}
.pin.on{color:var(--accent)}
/* quick picks */
.qp-h{font-size:.74rem;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);margin:6px 0 10px}
.qp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.qp button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font:inherit;font-size:.85rem;border-radius:10px;padding:9px 13px;cursor:pointer}
.qp button:active{transform:translateY(1px)}
.notice{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;font-size:.82rem;color:var(--ink2);margin:20px 0}
.notice b{color:var(--ink)}
/* detail + sheet */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.55);
  display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:860px;max-height:92vh;overflow:auto;
  border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.4);
  padding:0 max(16px,var(--safe-l)) calc(28px + var(--safe-b)) max(16px,var(--safe-r));
  animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-bar{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:1}
.sheet-bar .tag{font-family:var(--mono);font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:6px;
  color:#fff;letter-spacing:.5px}
.tag.QRH{background:var(--qrh)} .tag.MEL{background:var(--mel)}
.tag.FCOM{background:var(--fcom)} .tag.NOTES{background:var(--notes)}
.tag.FCTM{background:var(--fctm)} .tag.OMA{background:var(--oma)}
.tag.OMC{background:var(--omc)} .tag.RAIG{background:var(--raig)}
.sheet-bar .x{margin-left:auto;border:0;background:var(--panel2);color:var(--ink2);
  width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.sheet h2{font-size:1.15rem;margin:16px 0 4px;line-height:1.25}
.sheet .crumb{font-size:.76rem;color:var(--ink3);margin-top:12px}
.body-text{white-space:pre-wrap;font-size:.95rem;line-height:1.62;margin-top:12px;color:var(--ink)}
.body-text.mono{font-family:var(--mono);font-size:.84rem;white-space:pre-wrap}
.more-h{font-size:.74rem;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);margin:22px 0 8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel);color:var(--ink2);font:inherit;font-size:.85rem;
  padding:9px 6px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.about-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.about-row span:first-child{color:var(--ink2)}
.about-row span:last-child{font-family:var(--mono);font-size:.82rem;text-align:right}
.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);margin:20px 0 6px}
.loading{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.loading .ring{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--ink2);font-size:.9rem;max-width:300px}
.loading b{color:var(--ink);display:block;font-size:1.1rem;margin-bottom:2px}
.err{color:var(--qrh);font-size:.85rem}
.htabs{margin:2px 0 12px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 15px;margin-bottom:10px;cursor:pointer;
  display:flex;align-items:center;gap:12px}
.bcard:active{transform:translateY(1px)}
.bcard .bmain{flex:1;min-width:0}
.bcard .btt{font-weight:650;font-size:1rem;line-height:1.25}
.bcard .bei{font-family:var(--mono);font-size:.74rem;color:var(--accent);margin-top:3px}
.badge{flex:none;font-size:.62rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:4px 8px;border-radius:6px;background:var(--accent-bg);color:var(--accent-ink);white-space:nowrap}
.badge.man{background:transparent;border:1px solid var(--qrh);color:var(--qrh)}
.bhint{color:var(--ink3);font-size:.82rem;margin:4px 0 14px;line-height:1.5}
.curbar{background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;padding:11px 14px;
  margin-top:12px;font-size:.88rem;color:var(--accent-ink);cursor:pointer}
.curbar b{color:var(--ink)}
.clrbtn{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink2);font:inherit;font-size:.72rem;border-radius:999px;padding:4px 11px;cursor:pointer}
.ai-brief{white-space:pre-wrap;font-size:.95rem;line-height:1.6;margin-top:12px;color:var(--ink);min-height:1.2em}
.ai-brief b{color:var(--ink)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow.col{flex-direction:column;align-items:stretch}
.setrow span{color:var(--ink2);font-size:.9rem}
.setrow input[type=text],.setrow select{margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;padding:9px 11px}
.setrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
code{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:.85em}
.brief-trig{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;font-size:.9rem;color:var(--ink);margin-top:12px}
.brief-trig b{color:var(--accent-ink);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.orient{font-size:.72rem;color:var(--ink3);font-style:italic;margin:14px 0 4px}
.brief-lead{font-size:.96rem;line-height:1.6;margin-top:4px}
.brief-first{background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;
  padding:12px 14px;margin-top:14px}
.brief-first .fl{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-weight:700;margin-bottom:5px}
.brief-first .ft{font-family:var(--mono);font-size:.84rem;line-height:1.55;color:var(--ink)}
.bsec-h{font-size:.74rem;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);
  margin:22px 0 2px;display:flex;align-items:center;gap:8px}
.bsec-h .ln{flex:1;height:1px;background:var(--line)}
.bchunk{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin-top:12px}
.bchunk .bx{white-space:pre-wrap;font-size:.88rem;line-height:1.55;color:var(--ink)}
.bchunk.QRH{border-color:var(--qrh)} .bchunk.FCOM{border-color:var(--fcom)}
.bchunk.FCTM{border-color:var(--fctm)} .bchunk.NOTES{border-color:var(--notes)}
.bchunk.OMA{border-color:var(--oma)} .bchunk.OMC{border-color:var(--omc)}
.seealso{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seealso button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font:inherit;font-size:.82rem;border-radius:999px;padding:7px 12px;cursor:pointer}
.grp-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);font-weight:700;margin:6px 0 10px}
.grp-h.two{margin-top:22px}
.ops-bottom{background:var(--accent-bg);border:1px solid var(--accent);border-radius:12px;
  padding:13px 15px;margin-top:12px;font-size:.95rem;line-height:1.55;color:var(--ink)}
.ops-bottom b{color:var(--accent-ink);font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
.opsg{margin-top:20px}
.opsg h3{font-size:.95rem;margin:0 0 4px;color:var(--ink);font-weight:700}
.opsg h3::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}
.opt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.opt:last-child{border-bottom:0}
.opt .dotn{flex:none;width:6px;height:6px;border-radius:50%;background:var(--ink3);margin-top:8px}
.opt .otx{flex:1;min-width:0;font-size:.92rem;line-height:1.5}
.cite{display:inline-block;margin-left:7px;font-family:var(--mono);font-size:.68rem;color:var(--accent);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;cursor:pointer;white-space:nowrap;vertical-align:baseline}
.cite.bad{color:#d98a8a;border-color:#5a3a3a;opacity:.85}
.cite:active{transform:translateY(1px)}
details.src{margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
details.src summary{cursor:pointer;font-size:.78rem;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);font-weight:700;list-style:none}
details.src summary::-webkit-details-marker{display:none}
details.src summary::before{content:"▸ ";color:var(--accent)}
details.src[open] summary::before{content:"▾ "}
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="ring"></div>
  <div><b>B777 Companion</b><p id="loadmsg">Loading the manuals…</p></div>
</div>

<header>
  <div class="wrap">
    <div class="hbar">
      <div class="brand">
        <b>B777 Companion</b>
        <small>On-demand briefs · study aid, not a controlled document</small>
      </div>
      <button class="hbtn" id="setBtn">⚙ AI</button>
      <button class="hbtn" id="aboutBtn">Currency</button>
      <button class="hbtn" id="themeBtn">◐</button>
    </div>
    <div class="searchrow">
      <div class="searchbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Any topic — e.g. STATUS AUTOBRAKE, autothrottle L, hot weather ops" enterkeyhint="search">
        <button class="clr" id="clr" hidden>×</button>
      </div>
      <div class="sugg" id="sugg" role="listbox" hidden></div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
function b64ToBytes(b64){var bin=atob(b64),n=bin.length,out=new Uint8Array(n);for(var i=0;i<n;i++)out[i]=bin.charCodeAt(i);return out;}
async function gunzipToText(bytes){
  if(typeof DecompressionStream!=="undefined"){
    var ds=new DecompressionStream("gzip");
    return await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  }
  throw new Error("This browser is too old — needs Safari 16.4+, Chrome or Edge.");
}

/* ---------- corpus + BM25 retrieval ---------- */

var SYN={

  "u/s":["inoperative","unserviceable"],"inop":["inoperative","inop","fault","failure"],"fail":["failure","failed","fault"],
  "wx":["weather"],"ldg":["landing"],"tko":["takeoff"],"to":["takeoff"],"dep":["departure"],"app":["approach"],
  "eng":["engine"],"hyd":["hydraulic"],"elec":["electrical","electric"],"gen":["generator"],"batt":["battery"],

  "rto":["rejected takeoff","reject"],"abort":["rejected takeoff"],
  "ws":["windshear","wind shear"],"windshear":["wind shear","predictive windshear"],
  "gpws":["ground proximity","terrain","pull up"],"egpws":["ground proximity","terrain","pull up"],"terrain":["gpws","pull up"],
  "tcas":["traffic","resolution advisory","ra","acas"],"ra":["resolution advisory","tcas"],
  "fire":["fire","smoke","overheat"],"smoke":["smoke","fumes","fire"],"fumes":["smoke","fumes"],"ovht":["overheat"],
  "fuel":["fuel"],"imbalance":["fuel imbalance","imbalance"],"jettison":["fuel jettison","dump"],"dump":["fuel jettison"],
  "ice":["icing","anti-ice","ice"],"deice":["de-ice","anti-ice","icing"],"anti-ice":["anti ice","icing"],"icing":["ice","anti-ice"],
  "flap":["flaps","slat","leading edge","trailing edge"],"slat":["slats","leading edge"],

          if(ev.type==="content_block_delta"&&ev.delta&&typeof ev.delta.text==="string"){onTok(ev.delta.text);}
          else if(ev.type==="message_stop"){onDone();return;}
          else if(ev.type==="error"){onErr((ev.error&&ev.error.message)||"stream error");return;}
        }catch(e){}}}
    onDone();
  }catch(e){onErr(claudeNetMsg(e));}
}

function bucketPicks(ranked){var used={},picks=[];
  ROLES.forEach(function(role){var got=0;for(var i=0;i<ranked.length&&got<role.n;i++){var r=ranked[i];if(used[r.id]||!role.f(r))continue;used[r.id]=1;r._role=role.h;picks.push(r);got++;}});
  return picks;}
function sourcesHTML(picks,terms){var html="",byr={};picks.forEach(function(r){(byr[r._role]=byr[r._role]||[]).push(r);});
  ROLES.forEach(function(role){var ps=byr[role.h];if(!ps)return;html+='<div class="opsg"><h3>'+esc(role.h)+'</h3>';ps.forEach(function(r){html+=resCard(r,terms);});html+='</div>';});
  return html;}
function composeBrief(q){
  var terms=hlTerms(q),ranked=searchRanked(q,70),cur=curatedMatch(q);
  if(!ranked.length&&!cur){main.innerHTML='<p class="hint">Nothing found for that. Try a system name, an EICAS message, or a phase of flight (e.g. <i>hydraulic</i>, <i>FUEL DISAGREE</i>, <i>oceanic</i>).</p>';return;}
  var picks=bucketPicks(ranked),head="";
  try{window.__validCites=new Set(picks.map(function(r){return normCite(citePlain(r));}));}catch(e){window.__validCites=null;}
  if(cur){
    head+='<div class="sheet-bar" style="padding-top:0"><span class="tag QRH">BRIEF</span>'+(cur.badge?'<span class="badge" style="margin-left:2px">'+esc(cur.badge)+'</span>':'')+'</div>';
    head+=briefBodyHTML(cur);
    if(AI.engine==="claude")head+='<div style="margin-top:14px"><button class="hbtn" id="askClaude" style="width:100%;padding:11px;font-size:.9rem">⌁ Ask Claude for a fresh online brief</button></div><div id="claudeMount"></div>';
    head+='<details class="src" style="margin-top:16px"><summary>More from your manuals ('+picks.length+' sections)</summary>'+sourcesHTML(picks,terms)+'</details>';
    main.innerHTML=head;window.scrollTo(0,0);
    if(AI.engine==="claude"){var _ac=document.getElementById("askClaude");if(_ac)_ac.addEventListener("click",function(){_ac.style.display="none";renderClaudeBrief(q,picks,document.getElementById("claudeMount"));});}
    return;
  }
  if(AI.engine!=="off"){
    if(AI.engine==="claude"){main.innerHTML="";renderClaudeBrief(q,picks,main);window.scrollTo(0,0);return;}
    var engn=AI.engine==="webllm"?("On-device · "+AI.wmodel.replace(/-MLC$/,"")):("Ollama · "+AI.model);
    head+='<div class="ops-bottom"><div style="display:flex;align-items:flex-start;gap:10px"><b style="flex:1">AI brief · '+esc(q)+'</b><button class="clrbtn" id="aiClear">Clear</button></div><span id="aistat" style="font-weight:400;color:var(--accent-ink)">preparing…</span></div>';
    head+='<div class="orient">Written by '+esc(engn)+' from the sources — generated, not authority. Confirm in the EFB.</div>';
    head+='<div class="ai-brief" id="aiout"></div>';
    head+='<details class="src"><summary>Show the '+picks.length+' manual sources used</summary>'+sourcesHTML(picks,terms)+'</details>';
    main.innerHTML=head;window.scrollTo(0,0);
    var out=document.getElementById("aiout"),stat=document.getElementById("aistat"),acc="";
    /* ---- live ETA / timing ---- */
    var _cal=etaGet(), TARGET_CH=_cal?_cal.avg:1800;   /* self-calibrated per device+model; 1800 until this device has written one */
    var phase="prep", tStart=Date.now(), tGen=0, tWait=0, progT0=0, progP0=0, timer=null;
    function fmtS(s){return s<1?"<1s":(s<60?Math.round(s)+"s":Math.floor(s/60)+"m"+("0"+Math.round(s%60)).slice(-2)+"s");}
    function tick(){
      if(!stat)return;
      if(!document.body.contains(stat)){clearInterval(timer);return;}  /* result cleared/replaced */
      if(phase==="prep"){stat.textContent="preparing · "+fmtS((Date.now()-tStart)/1000);}
      else if(phase==="wait"){
        var w=(Date.now()-tWait)/1000, s="generating · "+fmtS(w);
        if(w>15)s+=window.__b7GenDone?" · compiling a new kernel on first use — one-time, then fast":" · first on-device run compiles shaders — can take a minute or two";
        if(w>180)s+=". Still nothing? Tap Clear and retry, or pick a smaller model in ⚙.";
        stat.textContent=s;
      }
      else if(phase==="gen"){
        var el=(Date.now()-tGen)/1000, cps=acc.length/Math.max(el,0.3), tps=cps/4;
        var s="writing · "+fmtS(el);
        if(tps>=0.5)s+=" · "+(tps>=1?Math.round(tps):tps.toFixed(1))+" tok/s";
        if(cps>5&&acc.length<TARGET_CH)s+=" · ~"+fmtS((TARGET_CH-acc.length)/cps)+" left";
        else if(acc.length>=TARGET_CH)s+=" · wrapping up…";
        stat.textContent=s;
      }
    }
    timer=setInterval(tick,250);tick();
    var onTok=function(tok){if(phase!=="gen"){phase="gen";tGen=Date.now();}acc+=tok;out.innerHTML=fmtAI(acc);};
    var onDone=function(){clearInterval(timer);window.__b7GenDone=true;if(acc)etaPut(acc.length);var el=tGen?((Date.now()-tGen)/1000):0;if(stat)stat.textContent="done in "+fmtS(el)+" — verify in the EFB";};
    var onErr=function(err){clearInterval(timer);if(stat)stat.textContent="error";out.innerHTML='<div class="notice">'+esc(err)+'</div>';};
    var onProg=function(txt,prog){if(!stat)return;
      if(prog&&prog>0){phase="load";if(!progT0){progT0=Date.now();progP0=prog;}
        var dt=(Date.now()-progT0)/1000, dp=prog-progP0, eta="";
        if(dp>0.02&&dt>0.6){eta=" · ~"+fmtS((1-prog)/(dp/dt))+" left";}
        stat.textContent=txt+" "+Math.round(prog*100)+"%"+eta;
      }else if(/generat/i.test(txt)){if(phase!=="wait"){phase="wait";tWait=Date.now();}}
      else{phase="load";stat.textContent=txt;}};
    if(AI.engine==="ollama") ollamaStream(buildPrompt(q,picks),onTok,onDone,onErr);
    else webllmStream(buildPrompt(q,picks,true),onTok,onDone,onErr,onProg);
  }else{
    var manset={};ranked.slice(0,40).forEach(function(r){manset[r.manual]=1;});
    head+='<div class="ops-bottom"><b>Brief · '+esc(q)+'</b>The operational picture pulled from your '+Object.keys(manset).map(function(m){return MLABEL[m];}).join(' · ')+'. Organised by what it means. <i>Turn on local AI in ⚙ to have your model write it.</i></div>';
    head+='<div class="orient">Assembled from your actual manuals — an organised read, not an AI opinion. Confirm in the EFB.</div>'+sourcesHTML(picks,terms);
    main.innerHTML=head;window.scrollTo(0,0);
  }
}

/* ---------- live topic autocomplete (sourced from BRIEFS, auto-updates as briefs grow) ---------- */
var suggEl=document.getElementById("sugg"),_tCache=null,_tCacheN=-1,suggItems=[],suggActive=-1;
function topicList(){
  if(_tCache&&_tCacheN===BRIEFS.length)return _tCache;      /* rebuilds whenever the brief set changes */
  var seen={},out=[];
  for(var i=0;i<BRIEFS.length;i++){var t=(BRIEFS[i].title||"").trim();if(!t)continue;var k=t.toLowerCase();if(seen[k])continue;seen[k]=1;out.push({t:t,l:k,tag:BRIEFS[i].tag||BRIEFS[i].badge||""});}
  out.sort(function(a,b){return a.l<b.l?-1:a.l>b.l?1:0;});
  _tCache=out;_tCacheN=BRIEFS.length;return out;
}
function hideSugg(){if(suggEl){suggEl.hidden=true;suggEl.innerHTML="";}suggItems=[];suggActive=-1;qEl.setAttribute("aria-expanded","false");}
function showSugg(raw){
  var q=(raw||"").trim().toLowerCase();if(!q){hideSugg();return;}
  var list=topicList(),res=[];
  for(var i=0;i<list.length;i++){var it=list[i],l=it.l,sc=-1;
    if(l.indexOf(q)===0)sc=0;
    else{var ws=l.split(/[^a-z0-9]+/);for(var w=0;w<ws.length;w++){if(ws[w]&&ws[w].indexOf(q)===0){sc=1;break;}}
      if(sc<0&&l.indexOf(q)>=0)sc=2;}
    if(sc<0)continue;
    if(l===q&&sc===0&&res.length)continue;   /* exact-typed title isn't a useful suggestion unless it's the only hit */
    res.push([sc,l.length,it]);}
  res.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]||(a[2].l<b[2].l?-1:1);});
  res=res.slice(0,12);
  if(!res.length){hideSugg();return;}
  suggItems=res.map(function(r){return r[2].t;});
  var ql=q.length,html="";
  for(var j=0;j<res.length;j++){var it=res[j][2],disp=esc(it.t),p=it.l.indexOf(q);
    if(p>=0)disp=esc(it.t.slice(0,p))+"<mark>"+esc(it.t.slice(p,p+ql))+"</mark>"+esc(it.t.slice(p+ql));
    html+='<div class="sgi" data-sugg="'+j+'" role="option"><span class="sgt">'+disp+'</span></div>';}
  suggEl.innerHTML=html;suggEl.hidden=false;suggActive=-1;qEl.setAttribute("aria-expanded","true");
}
function setActive(i){var rows=suggEl.children;if(!rows.length)return;
  if(suggActive>=0&&rows[suggActive])rows[suggActive].classList.remove("on");
  suggActive=(i+rows.length)%rows.length;rows[suggActive].classList.add("on");
  if(rows[suggActive].scrollIntoView)rows[suggActive].scrollIntoView({block:"nearest"});}
function pickSugg(i){if(i<0||i>=suggItems.length)return;qEl.value=suggItems[i];clrEl.hidden=false;hideSugg();clearTimeout(tmr);run();qEl.blur();window.scrollTo(0,0);}

qEl.addEventListener("input",function(){clearTimeout(tmr);showSugg(qEl.value);tmr=setTimeout(run,150);});
qEl.addEventListener("focus",function(){if(qEl.value.trim())showSugg(qEl.value);});
qEl.addEventListener("keydown",function(e){
  if(suggEl.hidden){if(e.key==="Enter")qEl.blur();return;}
  if(e.key==="ArrowDown"){e.preventDefault();setActive(suggActive+1);}
  else if(e.key==="ArrowUp"){e.preventDefault();setActive(suggActive-1);}
  else if(e.key==="Enter"){if(suggActive>=0){e.preventDefault();pickSugg(suggActive);}else{hideSugg();qEl.blur();}}
  else if(e.key==="Escape"){hideSugg();}
});
suggEl.addEventListener("mousedown",function(e){var r=e.target.closest("[data-sugg]");if(r){e.preventDefault();pickSugg(+r.dataset.sugg);}});
document.addEventListener("click",function(e){if(!e.target.closest(".searchrow"))hideSugg();});

/* ---- on-device data store (IndexedDB) + first-run import ---- */
function idb(mode,fn){return new Promise(function(res,rej){var o=indexedDB.open("b7db",1);
  o.onupgradeneeded=function(){o.result.createObjectStore("kv");};
  o.onerror=function(){rej(o.error);};
  o.onsuccess=function(){try{var st=o.result.transaction("kv",mode).objectStore("kv");fn(st,res,rej);}catch(e){rej(e);}};});}
function idbGet(k){return idb("readonly",function(st,res,rej){var r=st.get(k);r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbSet(k,v){return idb("readwrite",function(st,res,rej){var r=st.put(v,k);r.onsuccess=function(){res();};r.onerror=function(){rej(r.error);};});}

async function loadData(bytes){
  var data=JSON.parse(await gunzipToText(bytes));
  var C=data.cols,iId=C.indexOf("id"),iMan=C.indexOf("manual"),iCr=C.indexOf("breadcrumb"),iT=C.indexOf("title"),iP=C.indexOf("page"),iR=C.indexOf("rev"),iRd=C.indexOf("revdate"),iTx=C.indexOf("text");
  var docs=data.rows.map(function(r){return {id:r[iId],manual:r[iMan],breadcrumb:r[iCr],title:r[iT],page:r[iP],rev:r[iR],revdate:r[iRd],text:r[iTx]};});
  MANIFEST.length=0;(data.man||[]).forEach(function(m){MANIFEST.push({manual:m[0],chunks:m[1],effective:m[2],stamp:m[3],rev:m[4]});});
  MANIFEST.sort(function(a,b){return MANUALS.indexOf(a.manual)-MANUALS.indexOf(b.manual);});
  BRIEFS=data.briefs||[];
  window.__DATAINFO=MANIFEST.map(function(m){return (MLABEL[m.manual]||m.manual);}).join(" · ")+"  ("+docs.length+" sections)";
  buildIndex(docs);
}
function finishReady(){home();document.getElementById("loading").style.display="none";qEl.focus();}
function showImport(isReplace){
  var l=document.getElementById("loading");l.style.display="flex";
  l.innerHTML='<div style="max-width:440px;text-align:center;padding:26px">'
    +'<b style="font-size:1.1rem">B777 Companion</b>'
    +'<p style="color:var(--ink2);line-height:1.55;margin:16px 0">'+(isReplace?'Load an updated ':'First run — load your ')
    +'manual data file (<code>b777data.json.gz</code>). It is stored on this device only; nothing is uploaded.</p>'
    +'<label class="impbtn" style="display:inline-block;background:var(--accent);color:#1a1205;font-weight:700;border-radius:999px;padding:12px 22px;cursor:pointer">Choose b777data.json.gz'
    +'<input id="impf" type="file" accept=".gz,application/gzip,application/octet-stream" style="display:none"></label>'
    +'<p id="impmsg" style="color:var(--ink2);margin-top:16px;min-height:1.2em"></p></div>';
  document.getElementById("impf").addEventListener("change",async function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    var im=document.getElementById("impmsg");
    try{im.textContent="Reading "+(f.size/1048576).toFixed(1)+" MB…";
      var buf=new Uint8Array(await f.arrayBuffer());
      im.textContent="Saving on device…";await idbSet("corpus",buf);
      im.textContent="Indexing…";await new Promise(function(r){setTimeout(r,0);});await loadData(buf);
      finishReady();
    }catch(err){im.innerHTML='<span class="err">'+esc(err.message||String(err))+'</span>';}
  });
}

/* boot */
(async function(){var msg=document.getElementById("loadmsg");
  try{
    var bytes=null; try{bytes=await idbGet("corpus");}catch(e){}
    if(!bytes){showImport(false);return;}
    if(!(bytes instanceof Uint8Array))bytes=new Uint8Array(bytes);
    msg.textContent="Unpacking the manuals…";await new Promise(function(r){setTimeout(r,0);});
    await loadData(bytes);
    finishReady();
  }catch(e){msg.innerHTML='<span class="err">Could not start: '+esc(e.message||String(e))+'</span>';var ring=document.querySelector(".ring");if(ring)ring.style.display="none";}
})();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
